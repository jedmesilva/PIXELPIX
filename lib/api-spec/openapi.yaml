openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cells
    description: Sparse one-million-cell grid and reservation flow
  - name: payments
    description: Provider payment webhook
  - name: admin
    description: Administrative prize operations and redemption monitoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cells:
    get:
      operationId: listCells
      tags: [cells]
      summary: Read a range of cells
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 999999 }
        - name: to
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 999999 }
      responses:
        "200":
          description: Non-default cells in the range; cells omitted from this response are available and rendered from their stable visual seed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CellRangeItem" }
        "400":
          description: Invalid range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cells/{id}:
    get:
      operationId: getCell
      tags: [cells]
      summary: Read one public cell
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 999999 }
      responses:
        "200":
          description: Cell state and approved public signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CellDetail" }
        "400":
          description: Invalid cell id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cells/reserve:
    post:
      operationId: reserveCell
      tags: [cells]
      summary: Reserve an available or expired cell
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CellReservationInput" }
      responses:
        "200":
          description: Reservation won
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CellReservation" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Cell is already reserved or paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "428":
          description: CAPTCHA escalation required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptchaRequiredResponse" }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cells/email:
    post:
      operationId: createCellCheckout
      tags: [cells]
      summary: Attach an email and create an idempotent Pix checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CellEmailInput" }
      responses:
        "200":
          description: Existing pending checkout reused or new checkout created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400":
          description: Invalid reservation or email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Payment provider is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cells/sign:
    post:
      operationId: signCell
      tags: [cells]
      summary: Submit a one-time public social signature for moderation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CellSignatureInput" }
      responses:
        "200":
          description: Signature queued for moderation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureResponse" }
        "400":
          description: Invalid reservation or signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Cell already has a signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /webhook/payment-confirmed:
    post:
      operationId: paymentConfirmedWebhook
      tags: [payments]
      summary: Process a signed provider payment confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhook" }
      responses:
        "200": { description: "Processed, duplicate, or queued for review" }
        "400":
          description: Invalid provider reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: Invalid HMAC signature }
        "500": { description: Provider should retry after an internal error }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Read the prize operation overview
      security:
        - AdminAccessKey: []
      responses:
        "200":
          description: Current balances, cell counts, and redemption counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401":
          description: Missing or invalid admin access key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/redemptions:
    get:
      operationId: listAdminRedemptions
      tags: [admin]
      summary: List prize redemption requests
      security:
        - AdminAccessKey: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, paid, rejected, all]
            default: all
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Redemption request page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRedemptionList" }
        "401":
          description: Missing or invalid admin access key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/redemptions/{id}:
    get:
      operationId: getAdminRedemption
      tags: [admin]
      summary: Read one redemption request with its cell and payment context
      security:
        - AdminAccessKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Redemption request detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRedemption" }
        "401":
          description: Missing or invalid admin access key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Redemption request not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateAdminRedemption
      tags: [admin]
      summary: Update the status of a redemption request
      security:
        - AdminAccessKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRedemptionUpdate" }
      responses:
        "200":
          description: Updated redemption request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRedemption" }
        "400":
          description: Invalid status transition or request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid admin access key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Redemption request not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/prize-pool:
    get:
      operationId: getAdminPrizePool
      tags: [admin]
      summary: Read prize pool tiers and immutable batch metadata
      security:
        - AdminAccessKey: []
      responses:
        "200":
          description: Prize pool detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPrizePool" }
        "401":
          description: Missing or invalid admin access key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    AdminAccessKey:
      type: apiKey
      in: header
      name: x-admin-access-key
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    CellRangeItem:
      type: object
      properties:
        id: { type: integer, minimum: 0, maximum: 999999 }
        status:
          type: string
          enum: [available, reserved, paid]
        emoji: { type: string }
        backgroundColor: { type: string }
      required: [id, status, emoji, backgroundColor]
    CellDetail:
      type: object
      properties:
        id: { type: integer, minimum: 0, maximum: 999999 }
        status:
          type: string
          enum: [available, reserved, paid]
        emoji: { type: string }
        backgroundColor: { type: string }
        prizeValueCents: { type: integer, minimum: 0 }
        prizeLabel: { type: ["string", "null"] }
        revealedBy: { type: ["string", "null"] }
        signature:
          oneOf:
            - { $ref: "#/components/schemas/PublicSignature" }
            - { type: "null" }
      required: [id, status, emoji, backgroundColor]
    PublicSignature:
      type: object
      properties:
        platform: { type: string, enum: [instagram, x] }
        handle: { type: string }
      required: [platform, handle]
    CellReservationInput:
      type: object
      properties:
        id: { type: integer, minimum: 0, maximum: 999999 }
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        captchaToken: { type: string }
      required: [id, deviceId]
    CellReservation:
      type: object
      properties:
        cellId: { type: integer, minimum: 0, maximum: 999999 }
        token: { type: string, format: uuid }
      required: [cellId, token]
    CellEmailInput:
      type: object
      properties:
        cellId: { type: integer, minimum: 0, maximum: 999999 }
        token: { type: string, format: uuid }
        email: { type: string, format: email }
        deviceId: { type: string, minLength: 8, maxLength: 128 }
      required: [cellId, token, email]
    CheckoutResponse:
      type: object
      properties:
        checkoutUrl: { type: string, format: uri-reference }
        amountCents: { type: integer, minimum: 0 }
        currency: { type: string }
      required: [checkoutUrl]
    CellSignatureInput:
      type: object
      properties:
        cellId: { type: integer, minimum: 0, maximum: 999999 }
        token: { type: string, format: uuid }
        platform: { type: string, enum: [instagram, x] }
        handle: { type: string, minLength: 1, maxLength: 30 }
      required: [cellId, token, platform, handle]
    SignatureResponse:
      type: object
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [pending] }
      required: [ok, status]
    CaptchaRequiredResponse:
      type: object
      properties:
        error: { type: string }
        captchaRequired: { type: boolean, const: true }
      required: [error, captchaRequired]
    PaymentWebhook:
      type: object
      properties:
        paymentId: { type: string }
        referenciaExterna:
          oneOf:
            - { type: string }
            - { type: object, additionalProperties: true }
        reference:
          type: object
          additionalProperties: true
      required: [paymentId]
    AdminOverview:
      type: object
      properties:
        availablePrizeBalanceCents: { type: integer, minimum: 0 }
        distributedPrizeCents: { type: integer, minimum: 0 }
        redeemedPrizeCents: { type: integer, minimum: 0 }
        totalPrizeToDistributeCents: { type: integer, minimum: 0 }
        pendingRedemptionCents: { type: integer, minimum: 0 }
        grossRevenueCents: { type: integer, minimum: 0 }
        refundsCents: { type: integer, minimum: 0 }
        cashAvailableCents: { type: integer, minimum: 0 }
        availableCells: { type: integer, minimum: 0 }
        reservedCells: { type: integer, minimum: 0 }
        paidCells: { type: integer, minimum: 0 }
        winnersCount: { type: integer, minimum: 0 }
        redemptionCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
      required:
        - availablePrizeBalanceCents
        - distributedPrizeCents
        - redeemedPrizeCents
        - totalPrizeToDistributeCents
        - pendingRedemptionCents
        - grossRevenueCents
        - refundsCents
        - cashAvailableCents
        - availableCells
        - reservedCells
        - paidCells
        - winnersCount
        - redemptionCounts
        - generatedAt
    AdminRedemption:
      type: object
      properties:
        id: { type: integer, minimum: 1 }
        cellId: { type: integer, minimum: 0, maximum: 999999 }
        email: { type: string, format: email }
        pixKey: { type: string }
        certificateCode: { type: string }
        requestedAmountCents: { type: integer, minimum: 0 }
        prizeValueCents: { type: integer, minimum: 0 }
        wonAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, approved, paid, rejected]
        requestedAt: { type: string, format: date-time }
        processedAt: { type: ["string", "null"], format: date-time }
        processedBy: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        cellStatus: { type: ["string", "null"] }
        paymentStatus: { type: ["string", "null"] }
      required:
        - id
        - cellId
        - email
        - pixKey
        - certificateCode
        - requestedAmountCents
        - prizeValueCents
        - wonAt
        - status
        - requestedAt
        - processedAt
        - processedBy
        - rejectionReason
        - cellStatus
        - paymentStatus
    AdminRedemptionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminRedemption" }
        total: { type: integer, minimum: 0 }
      required: [items, total]
    AdminRedemptionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, paid, rejected]
        rejectionReason: { type: string, maxLength: 500 }
      required: [status]
    AdminPrizeTier:
      type: object
      properties:
        tierId: { type: integer }
        label: { type: string }
        nominalValueCents: { type: integer, minimum: 0 }
        totalValueCents: { type: integer, minimum: 0 }
        totalPositions: { type: integer, minimum: 0 }
        foundPositions: { type: integer, minimum: 0 }
        foundValueCents: { type: integer, minimum: 0 }
        remainingValueCents: { type: integer, minimum: 0 }
        remainingPositions: { type: integer, minimum: 0 }
        redeemedPositions: { type: integer, minimum: 0 }
        redeemedValueCents: { type: integer, minimum: 0 }
        pendingRedemptionPositions: { type: integer, minimum: 0 }
        pendingRedemptionValueCents: { type: integer, minimum: 0 }
        rejectedPositions: { type: integer, minimum: 0 }
        rejectedValueCents: { type: integer, minimum: 0 }
      required:
        - tierId
        - label
        - nominalValueCents
        - totalValueCents
        - totalPositions
        - foundPositions
        - foundValueCents
        - remainingValueCents
        - remainingPositions
        - redeemedPositions
        - redeemedValueCents
        - pendingRedemptionPositions
        - pendingRedemptionValueCents
        - rejectedPositions
        - rejectedValueCents
    AdminPrizePool:
      type: object
      properties:
        tiers:
          type: array
          items: { $ref: "#/components/schemas/AdminPrizeTier" }
        commitHash: { type: ["string", "null"] }
        batchCreatedAt: { type: ["string", "null"], format: date-time }
        batchRevealedAt: { type: ["string", "null"], format: date-time }
        safetyMarginBps: { type: ["integer", "null"], minimum: 0 }
      required: [tiers, commitHash, batchCreatedAt, batchRevealedAt, safetyMarginBps]

